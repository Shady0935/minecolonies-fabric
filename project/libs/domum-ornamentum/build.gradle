plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.modGroup
base { archivesName = project.modBaseName + '-fabric-1.20.1' }

repositories {
    mavenCentral()
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
    }
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'src/api/java']
        resources.srcDirs = [
            'src/main/resources',
            'src/api/resources',
            // The port keeps the generated block tags, models and recipes
            // under the original datagen output tree.
            'src/datagen/generated/domum_ornamentum'
        ]
        java.exclude('**/datagen/**')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // JEI support is optional at runtime and its API is never bundled.
    modCompileOnly 'mezz.jei:jei-1.20.1-fabric-api:15.62.0.216'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '5000', '-Xmaxwarns', '0']
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

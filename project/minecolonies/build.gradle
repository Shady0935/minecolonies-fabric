plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

fabricApi {
    configureDataGeneration {
        modId = project.mod_id
        outputDirectory = file('src/main/generated/resources')
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/api/java']
            // Optional integrations stay out of the Fabric runtime. Datagen is
            // compiled again so the Fabric entrypoint can reuse the portable
            // 1.20.1 providers; the remaining Forge-only adapters are listed
            // explicitly until their Fabric implementations replace them.
            exclude '**/generation/defaults/DefaultAdvancementsProvider.java'
            exclude '**/generation/defaults/DefaultBlockTagsProvider.java'
            exclude '**/generation/defaults/DefaultDamageTagsProvider.java'
            exclude '**/generation/defaults/DefaultDamageTypeProvider.java'
            exclude '**/generation/defaults/DefaultEntityIconProvider.java'
            exclude '**/generation/defaults/DefaultEntityTypeTagsProvider.java'
            exclude '**/generation/defaults/DefaultItemTagsProvider.java'
            exclude '**/generation/defaults/QuestTranslationProvider.java'
            exclude '**/compatibility/jei/**'
            exclude '**/compatibility/journeymap/**'
        }
        resources {
            srcDirs = ['src/main/resources', 'src/main/generated/resources']
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation files(project.blockui_jar)
    implementation files(project.domum_jar)
    implementation files(project.structurize_jar)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/accesstransformer.cfg'
    exclude '**/.cache/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '5000', '-Xmaxwarns', '0']
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

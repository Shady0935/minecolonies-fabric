plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Optional Fabric compatibility APIs; these remain compile-only and are
    // never bundled or required by MineColonies at runtime.
    maven {
        name = 'FabricModApis'
        url = 'https://maven.blamejared.com'
    }
}

def serverBundleFabricApi = configurations.create('serverBundleFabricApi') {
    canBeConsumed = false
    canBeResolved = true
}

fabricApi {
    configureDataGeneration {
        modId = project.mod_id
        outputDirectory = file('src/main/generated/resources')
    }
}

// Keep the headless Fabric GameTest launcher reproducible from Gradle. The
// dedicated run directory is separate from the normal server probe. Set
// -PgameTestRunDir=run-gametest-<id> for a fresh isolated run; preserve old
// run directories rather than silently reusing or deleting them.
def gameTestRunDir = project.providers.gradleProperty('gameTestRunDir').getOrElse('run-gametest')
// Run selected Fabric GameTests through the in-game /test command without
// auto-running the complete suite; keep this server profile isolated as well.
def gameTestManualRunDir = project.providers.gradleProperty('gameTestManualRunDir').getOrElse('run-gametest-manual')
// Keep the visual client probe isolated from the saved default `run` profile.
// Override this with -PclientVisualRunDir=run-client-<id> for a fresh profile.
def clientVisualRunDir = project.providers.gradleProperty('clientVisualRunDir').getOrElse('run-client')
// Keep the offline development identity stable so a relaunched client can own
// and continue testing the same saved single-player colony.
def clientVisualUsername = project.providers.gradleProperty('clientVisualUsername').getOrElse('Player847')
loom {
    accessWidenerPath = file('src/main/resources/minecolonies.accesswidener')
    runs {
        clientVisual {
            client()
            runDir clientVisualRunDir
            programArg '--username'
            programArg clientVisualUsername
        }
        gametest {
            server()
            runDir gameTestRunDir
            vmArg '-Dfabric-api.gametest=true'
            vmArg "-Dfabric-api.gametest.report-file=${project.file('build/gametest/junit.xml').absolutePath}"
            if (project.providers.gradleProperty('aiMetrics').getOrElse('false').toBoolean()) {
                vmArg '-Dminecolonies.ai.metrics=true'
            }
        }
        gametestManual {
            server()
            runDir gameTestManualRunDir
            vmArg '-Dfabric-api.gametest.command=true'
            if (project.providers.gradleProperty('persistenceProbe').getOrElse('false').toBoolean()) {
                vmArg '-Dminecolonies.persistence-tests=true'
            }
            programArg '--nogui'
            programArg '--port'
            programArg '0'
        }
        multipistonDedicatedServer {
            server()
            runDir 'run-dedicated-multipiston-20260922'
            programArg '--nogui'
            programArg '--port'
            programArg '0'
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/api/java']
            // Optional integrations compile against their public APIs but are
            // only discovered when the corresponding client mod is present.
            // Their APIs are compile-only and are never bundled.
        }
        resources {
            // The native Fabric datagen output is the runtime source of truth.
            // The retained upstream snapshot lives outside this source set and
            // is used only for audits and byte/semantic parity comparisons.
            srcDirs = ['src/main/generated/resources', 'src/main/resources']
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    add('serverBundleFabricApi', "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    implementation files(project.blockui_jar)
    implementation files(project.domum_jar)
    implementation files(project.structurize_jar)
    modImplementation files(project.multipiston_jar)

    modCompileOnly 'mezz.jei:jei-1.20.1-fabric-api:15.62.0.216'
    modCompileOnlyApi 'info.journeymap:journeymap-api-fabric:1.20.1-2.0.0'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    inputs.files(
        'src/main/resources/assets/minecolonies/lang/manual_en_us.json',
        'src/main/resources/assets/minecolonies/lang/en_us.json',
        'src/main/resources/assets/minecolonies/lang/es_es.json',
        fileTree(dir: 'src/main/translations/es_es', includes: ['*.json']),
        'src/main/generated/resources/assets/minecolonies/lang/default.json',
        'src/main/generated/resources/assets/minecolonies/lang/quests.json'
    ).withPropertyName('minecoloniesTranslations')
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/accesstransformer.cfg'
    exclude '**/.cache/**'

    // Minecraft only loads language files named for a real locale. MineColonies keeps
    // authored translations in manual_<locale>.json and datagen emits research/quest
    // strings separately, so fold the English sources together and assemble the authored
    // Spanish translations for both locales. Do not silently ship English fallbacks.
    doLast {
        final File languageDirectory = new File(destinationDir, 'assets/minecolonies/lang')
        final List<File> languageSources = [
            file('src/main/resources/assets/minecolonies/lang/manual_en_us.json'),
            file('src/main/resources/assets/minecolonies/lang/en_us.json'),
            file('src/main/generated/resources/assets/minecolonies/lang/default.json'),
            file('src/main/generated/resources/assets/minecolonies/lang/quests.json')
        ]
        final Map<String, Object> mergedTranslations = new LinkedHashMap<>()
        languageSources.each { File languageSource ->
            if (!languageSource.isFile()) {
                throw new GradleException("Required MineColonies language source is missing: ${languageSource}")
            }

            final Object parsed = new groovy.json.JsonSlurper().parse(languageSource, 'UTF-8')
            if (!(parsed instanceof Map)) {
                throw new GradleException("MineColonies language source must be a JSON object: ${languageSource}")
            }
            // The port-owned en_us overlay wins over upstream manual text; generated
            // research and quest names are distinct keys and are appended last.
            mergedTranslations.putAll((Map<String, Object>) parsed)
        }

        final File englishRuntimeLanguage = new File(languageDirectory, 'en_us.json')
        englishRuntimeLanguage.parentFile.mkdirs()
        englishRuntimeLanguage.setText(groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson(mergedTranslations)) + System.lineSeparator(), 'UTF-8')

        ['es_es', 'es_mx'].each { String locale ->
            final Map<String, Object> localizedTranslations = new LinkedHashMap<>(mergedTranslations)
            final Map<String, Object> authoredSpanish = new LinkedHashMap<>()
            final List<File> localizedSources = [
                file('src/main/resources/assets/minecolonies/lang/es_es.json')
            ]
            localizedSources.addAll(fileTree(
                dir: 'src/main/translations/es_es', includes: ['*.json']).files.sort { it.name })
            localizedSources.each { File localizedSource ->
                if (!localizedSource.isFile()) {
                    return
                }

                final Object parsed = new groovy.json.JsonSlurper().parse(localizedSource, 'UTF-8')
                if (!(parsed instanceof Map)) {
                    throw new GradleException("MineColonies translation source must be a JSON object: ${localizedSource}")
                }
                authoredSpanish.putAll((Map<String, Object>) parsed)
            }

            final Set<String> missingTranslations = new LinkedHashSet<>(mergedTranslations.keySet())
            missingTranslations.removeAll(authoredSpanish.keySet())
            if (!missingTranslations.isEmpty()) {
                throw new GradleException("MineColonies ${locale} is missing ${missingTranslations.size()} Spanish translations: ${missingTranslations.take(10)}")
            }

            final Set<String> unexpectedTranslations = new LinkedHashSet<>(authoredSpanish.keySet())
            unexpectedTranslations.removeAll(mergedTranslations.keySet())
            if (!unexpectedTranslations.isEmpty()) {
                throw new GradleException("MineColonies ${locale} has ${unexpectedTranslations.size()} unknown Spanish keys: ${unexpectedTranslations.take(10)}")
            }

            final java.util.regex.Pattern formatPattern = java.util.regex.Pattern.compile(
                '%(?:\\d+\\$)?[-+#0,(<]*\\d*(?:\\.\\d+)?[a-zA-Z%]|\\$\\d+|§.')
            mergedTranslations.each { String translationKey, Object englishValue ->
                final Object spanishValue = authoredSpanish.get(translationKey)
                if (englishValue instanceof String && spanishValue instanceof String) {
                    final List<String> englishTokens = []
                    final java.util.regex.Matcher englishMatcher = formatPattern.matcher((String) englishValue)
                    while (englishMatcher.find()) {
                        englishTokens.add(englishMatcher.group())
                    }

                    final List<String> spanishTokens = []
                    final java.util.regex.Matcher spanishMatcher = formatPattern.matcher((String) spanishValue)
                    while (spanishMatcher.find()) {
                        spanishTokens.add(spanishMatcher.group())
                    }

                    final List<String> englishPositionalTokens = englishTokens.findAll {
                        it.startsWith('%') && it.indexOf('$') > 0
                    }.sort()
                    final List<String> spanishPositionalTokens = spanishTokens.findAll {
                        it.startsWith('%') && it.indexOf('$') > 0
                    }.sort()
                    final List<String> englishOrderedTokens = englishTokens.findAll {
                        !(it.startsWith('%') && it.indexOf('$') > 0)
                    }
                    final List<String> spanishOrderedTokens = spanishTokens.findAll {
                        !(it.startsWith('%') && it.indexOf('$') > 0)
                    }

                    if (englishPositionalTokens != spanishPositionalTokens ||
                        englishOrderedTokens != spanishOrderedTokens) {
                        throw new GradleException("MineColonies ${locale} has mismatched format tokens for ${translationKey}: ${englishTokens} != ${spanishTokens}")
                    }
                }
            }
            localizedTranslations.putAll(authoredSpanish)

            final File runtimeLanguage = new File(languageDirectory, "${locale}.json")
            runtimeLanguage.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(localizedTranslations)) + System.lineSeparator(), 'UTF-8')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '5000', '-Xmaxwarns', '0']
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def serverDependencyJars = [
    file('../libs/blockui/build/libs/blockui-fabric-1.20.1-0.0.1-port.jar'),
    file('../libs/domum-ornamentum/build/libs/domum-ornamentum-fabric-1.20.1-1.0.0-port.jar'),
    file('../libs/structurize/build/libs/structurize-fabric-1.20.1-1.0.0-port.jar'),
    file('../libs/multipiston/build/libs/multipiston-fabric-1.20.1-0.0.1-port.jar')
]

tasks.register('serverModsBundle', Zip) {
    group = 'distribution'
    description = 'Packages the remapped MineColonies Fabric server mods and required runtime dependencies.'
    dependsOn tasks.named('remapJar')
    archiveBaseName = "minecolonies-fabric-${project.minecraft_version}"
    archiveVersion = project.version
    archiveClassifier = 'server-mods'
    destinationDirectory = layout.buildDirectory.dir('distributions')

    from(tasks.named('remapJar').flatMap { it.archiveFile }) {
        into 'mods'
    }
    from(serverDependencyJars) {
        into 'mods'
    }
    from(serverBundleFabricApi) {
        into 'mods'
    }
    from('../../docs/SERVER_DISTRIBUTION.md') {
        into 'docs'
    }

    doFirst {
        final missingJars = serverDependencyJars.findAll { !it.isFile() }
        if (!missingJars.isEmpty()) {
            throw new GradleException("Build the required Fabric dependency jars before bundling: ${missingJars}")
        }
        final fabricApiJars = serverBundleFabricApi.files.findAll {
            it.name == "fabric-api-${project.fabric_version}.jar"
        }
        if (fabricApiJars.size() != 1) {
            throw new GradleException("Expected one Fabric API ${project.fabric_version} runtime jar, found ${fabricApiJars}")
        }
    }
}
